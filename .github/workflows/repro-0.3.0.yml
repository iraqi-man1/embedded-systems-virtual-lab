# TEMPORARY: runs the parts-guide round trips of tools/e2e-desktop.mjs on the
# 0.3.0 application (with only the DevTools test hook added) in WebView2, to
# see whether the empty window reported for 0.3.0 reproduces there. To be
# removed once it has run.
name: Reproduce the 0.3.0 empty window

on: workflow_dispatch

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: new
      - uses: actions/checkout@v4
        with:
          ref: v0.3.0
          path: old
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: old/src-tauri -> target
      - name: The 0.3.0 application with the test hook only
        shell: bash
        run: |
          cp new/.github/repro/lib-0.3.0.rs old/src-tauri/src/lib.rs
          node -e "const fs=require('fs');const f='old/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.app.windows[0].create=false;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build 0.3.0
        working-directory: old
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Parts guide round trips on 0.3.0
        shell: bash
        timeout-minutes: 10
        run: |
          cd new
          npm install --no-save playwright-core@1.56.1
          node tools/e2e-desktop.mjs --exe ../old/src-tauri/target/release/evlab.exe --guide-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-0.3.0
          path: new/.toolchain/e2e/
          if-no-files-found: ignore
