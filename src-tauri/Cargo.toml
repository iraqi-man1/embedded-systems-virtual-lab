[package]
name = "evlab"
version = "0.4.0"
description = "Embedded Systems Virtual Lab"
edition = "2021"
rust-version = "1.77"

[lib]
name = "evlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's WebView2 bindings (used to turn off browser accelerator keys).
webview2-com = "0.39"
windows = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
