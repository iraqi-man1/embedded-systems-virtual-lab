[package]
name = "evlab"
version = "0.1.0"
description = "Embedded Systems Virtual Lab"
edition = "2021"
rust-version = "1.77"

[lib]
name = "evlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
